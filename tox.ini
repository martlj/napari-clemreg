# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{311,312}-{linux,macos,windows}

[gh-actions]
python =
    3.11: py311
    3.12: py312

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
    KMP_DUPLICATE_LIB_OK
    OMP_NUM_THREADS
setenv =
    KMP_DUPLICATE_LIB_OK = TRUE
    OMP_NUM_THREADS = 1
# Note: the `empanada` extra (empanada-dl, needed by the bundled EM
# Segmentation widget) is deliberately NOT installed here -- empanada-dl
# is stuck at 0.1.7 and hard-pins numpy==1.22, unresolvable against
# numpy>=1.26 on Python 3.11/3.12 (see issue #5). Since it's now an
# extra rather than a hard install_requires pin, the base package (and
# the segment-flow extra) installs normally without it.
extras = segment-flow
deps =
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/
    pytest-xvfb ; sys_platform == 'linux'
    pytest-qt
    qtpy
    pyqt5
commands = pytest -v --color=yes --cov=napari_clemreg --cov-report=xml
