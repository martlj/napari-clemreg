# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{311,312}-{linux,macos,windows}

[gh-actions]
python =
    3.11: py311
    3.12: py312

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
    KMP_DUPLICATE_LIB_OK
    OMP_NUM_THREADS
setenv =
    KMP_DUPLICATE_LIB_OK = TRUE
    OMP_NUM_THREADS = 1
# empanada-dl (a hard install_requires pin, see issue #5) hard-pins
# numpy==1.22, which is unresolvable against the numpy>=1.26 pin below on
# Python 3.11/3.12 -- so a normal `pip install .` cannot succeed right
# now. Install the package with --no-deps and list every other runtime
# dependency explicitly here instead (mirrors setup.cfg's
# install_requires minus empanada-dl). Simplify this back to a normal
# install once #5 lands.
skip_install = true
commands_pre = python -m pip install --no-deps -e .
deps =
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/
    pytest-xvfb ; sys_platform == 'linux'
    pytest-qt
    qtpy
    pyqt5
    npe2
    typing_extensions
    setuptools
    packaging
    pint
    numpy >= 1.26,<3
    magicgui >= 0.8.3
    scipy >= 1.11
    napari >= 0.6
    scikit-image >= 0.22
    h5py >= 3.9.0
    matplotlib >= 3.7.3
    imageio >= 2.31.5
    tifffile >= 2023.7.10
    probreg >= 0.3.6
    open3d >= 0.18
    transforms3d >= 0.4.1
    tqdm >= 4.66.1
    pooch >= 1.8
    torch >= 2.2
    connected-components-3d >= 3.12.3
commands = pytest -v --color=yes --cov=napari_clemreg --cov-report=xml
