[metadata]
name = napari-clemreg
version = 0.2.1
author = Daniel Krentzel
author_email = dkrentzel@pm.me
license = MIT
url = https://github.com/krentzd/napari-clemreg
description = A plugin for registering multimodal image volumes based on common segmented structures of interest with point-clouds.
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
	Development Status :: 2 - Pre-Alpha
	Intended Audience :: Developers
	Framework :: napari
	Topic :: Software Development :: Testing
	Programming Language :: Python
	Programming Language :: Python :: 3
	Programming Language :: Python :: 3.11
	Programming Language :: Python :: 3.12
	Operating System :: OS Independent
	License :: OSI Approved :: MIT License
project_urls = 
	Bug Tracker = https://github.com/krentzd/napari-clemreg/issues
	Documentation = https://github.com/krentzd/napari-clemreg#README.md
	Source Code = https://github.com/krentzd/napari-clemreg
	User Support = https://github.com/krentzd/napari-clemreg/issues

[options]
packages = find:
python_requires = >=3.11
setup_requires = setuptools_scm
install_requires =
	typing_extensions
	setuptools
	packaging
	numpy >= 1.26,<3
	magicgui >= 0.8.3
	scipy >= 1.11
	napari >= 0.6
	scikit-image >= 0.22
	h5py >= 3.9.0
	matplotlib >= 3.7.3
	imageio >= 2.31.5
	tifffile >= 2023.7.10
	probreg >= 0.3.6
	open3d >= 0.18
	transforms3d >= 0.4.1
	tqdm >= 4.66.1
	pooch >= 1.8
	# empanada-dl is stuck at 0.1.7 and hard-pins numpy==1.22, which has no
	# Python 3.11 wheels -- this is why `pip install napari-clemreg` will
	# not resolve on 3.11 today despite python_requires above. Tracked at
	# https://github.com/martlj/napari-clemreg/issues/5; do not loosen this
	# pin until a compatible empanada-dl (or replacement) is available.
	empanada-dl == 0.1.7
	torch >= 2.2
	connected-components-3d >= 3.12.3

include_package_data = True

[options.entry_points]
napari.manifest = 
	napari-clemreg = napari_clemreg:napari.yaml

[options.package_data]
* = *.yaml

[tool:pytest]
markers =
	slow: marks tests as slow/network-heavy (run with --run-slow)
