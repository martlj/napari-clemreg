name: tests

on:
  push:
    branches:
      - main
      - modernisation
  pull_request:
    branches:
      - main
      - modernisation

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # windows-latest is deliberately excluded: open3d's Windows wheel
      # initialises an OpenGL context at import time and needs real
      # GPU-backed OpenGL 4.1+ support (confirmed against isl-org/Open3D#4468,
      # #5328 -- the community fixes involve installing CUDA or repairing
      # DirectX on a real desktop GPU). GitHub's headless windows-latest
      # runner has no GPU and no equivalent to Linux's Mesa software
      # rasterizer (llvmpipe), which is what lets ubuntu-latest work here.
      # tox.ini still declares a windows factor for real end-user installs,
      # which do have a GPU.
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Graphical libraries needed by Qt/vispy for a headless napari import,
      # mirroring the system packages already used in clemreg.dockerfile
      # (written for Ubuntu 22.04 -- libegl1-mesa/libgl1-mesa-glx were
      # renamed to libegl1/libgl1 by the time ubuntu-latest moved to 24.04).
      # libxcb-cursor0 is required separately: since Qt 6.5, the xcb
      # platform plugin dlopen()s it, and its absence aborts the process
      # (SIGABRT) the instant a QApplication is constructed -- it doesn't
      # surface as an ImportError, so it's easy to miss until a test
      # actually instantiates Qt (PyQt6-Qt6==6.11.2 here).
      - name: Install Qt/X11 system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -qqy \
            libegl1 \
            libopengl0 \
            libgl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libxrender1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxi6 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xfixes0 \
            libxcb-shape0

      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-gh-actions

      - name: Test with tox
        run: tox
        env:
          PLATFORM: ${{ matrix.platform }}
          # Real-Viewer smoke tests (test_real_viewer.py) need a real X server
          # and GL context, which pytest-xvfb provides on Linux only.
          CLEMREG_REAL_VIEWER: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Upload coverage to Codecov
        if: matrix.platform == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
