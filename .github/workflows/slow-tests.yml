name: slow tests

# Runs the tests marked `slow`, which the per-push `tests` workflow skips:
# real sample-data downloads, reader checks against the real Zenodo files,
# and the end-to-end Run Registration test (test_gui_end_to_end.py).
# Weekly, and on demand from the Actions tab.
#
# The real Segment-Flow run (test_segment_flow_segmentation.py) still
# skips here, since the runner has no Nextflow. Run that one by hand
# before a release.

on:
  schedule:
    - cron: "0 5 * * 1"  # Mondays, 05:00 UTC
  workflow_dispatch:

jobs:
  slow:
    name: ubuntu-latest py3.11 (--run-slow)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # About 600 MB from Zenodo. pooch checks each file's hash, so a
      # stale cache is re-downloaded rather than used. The key follows
      # sample_data.py, where the registry and hashes live.
      - name: Cache sample data
        uses: actions/cache@v4
        with:
          path: ~/.cache/napari-clemreg
          key: clemreg-sample-data-${{ hashFiles('napari_clemreg/clemreg/sample_data.py') }}

      - name: Install Qt/X11 system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -qqy \
            libegl1 \
            libopengl0 \
            libgl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libxrender1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxi6 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xfixes0 \
            libxcb-shape0

      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-gh-actions

      - name: Test with tox (--run-slow)
        run: tox -- --run-slow
        env:
          PLATFORM: ubuntu-latest
          CLEMREG_REAL_VIEWER: "1"
